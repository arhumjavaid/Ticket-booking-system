# Minimal tuning on top of Postgres defaults for local streaming
# replication. In production this would be generated by your DBA tooling
# (e.g. Patroni) rather than hand-maintained.
listen_addresses = '*'
wal_level = replica
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
wal_keep_size = 256
