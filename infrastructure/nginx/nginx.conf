worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     'upstream=$upstream_addr rt=$request_time uht=$upstream_header_time';

    access_log /dev/stdout main;
    error_log  /dev/stderr warn;

    # Correlation id (section 33): reuse an incoming X-Request-ID if the
    # client already sent one, otherwise mint one here so it is present
    # for every hop from this point on (API -> Booking Service -> ... ).
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # least_conn (section 14): send each request to whichever healthy
    # API instance currently has the fewest open connections, rather than
    # blind round robin - this matters because booking requests can hold a
    # connection open longer (DB transaction + lock) than a browse request.
    upstream api_servers {
        least_conn;
        server api-1:3000 max_fails=3 fail_timeout=10s;
        server api-2:3000 max_fails=3 fail_timeout=10s;
        server api-3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id_final;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 3s;
        }

        location ~ ^/(health|ready|metrics)$ {
            proxy_pass http://api_servers;
            proxy_set_header X-Request-ID $request_id_final;
        }

        # Server-Sent Events for live seat availability - disable buffering
        # so events reach the browser as soon as Nginx receives them.
        location ~ ^/api/events/[^/]+/stream$ {
            proxy_pass http://api_servers;
            proxy_set_header X-Request-ID $request_id_final;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
