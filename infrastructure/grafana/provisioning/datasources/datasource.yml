apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Direct SQL against the primary — "Users in DB" tables/stats on the overview dashboard.
  - name: Postgres
    uid: postgres-ticketing
    type: postgres
    access: proxy
    url: postgres-primary:5432
    user: ticketing
    editable: false
    jsonData:
      database: ticketing
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
      postgresVersion: 1600
    secureJsonData:
      password: ticketing
